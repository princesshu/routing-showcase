name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token, even if the repository default changes later.
permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [nextjs, astro, tanstack-start]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # The build regenerates the committed route tree; any difference means
      # it no longer matches src/routes/.
      - if: matrix.app == 'tanstack-start'
        run: git diff --exit-code -- src/routeTree.gen.ts

      - run: pnpm route-map --check
